spring:
  liquibase:
    enabled: false
  cache:
    TTL-minutes: 5
    type: caffeine

direct-file:
  local-encryption:
    local-wrapping-key: "wjI02W2sBT1Q9P9iGTqkyEwFme4l04uz7nUYqXsntQU="
  status:
    mock: true
    url: http://localhost:8080
  exported-facts:
    enabled: true
    mock: true
    url: http://localhost:8080/
  cert-location-override: unexpired.cer

authorization-token:
  # Use a valid test key (not the published development key)
  signing-key: 0123456789abcdef0123456789abcdef

aws:
  enabled: false
  region: us-west-2
  kmsEndpoint: http://directfile.test

feature-flags:
  export-return:
    variants:
      on: true;
      off: false
    default-variant: on

openfeature-starter:
  s3-provider:
    environment-prefix:
    bucket: test
    object: "feature-flags.json"
    expiration: 1m
