spring:
  liquibase:
    contexts: dev

authorization-token:
  # No default. Set STATE_API_AUTHORIZATION_TOKEN_SIGNING_KEY (>= 32 bytes).
  # AuthorizationTokenService refuses to start without it.
  signing-key: ${STATE_API_AUTHORIZATION_TOKEN_SIGNING_KEY}

aws:
  enabled: false
  s3:
    accessKey: accessKey
    secretKey: secretKey
    region: us-west-2
    certBucketName: cert-bucket
    endPoint: http://s3.localhost.localstack.cloud:4566/

direct-file:
  local-encryption:
    local-wrapping-key: ${LOCAL_WRAPPING_KEY}
  cert-location-override: fakestate.cer
