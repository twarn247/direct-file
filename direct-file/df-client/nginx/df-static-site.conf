# Copied to /etc/nginx/conf.d/default.conf, replacing the stock one. No build
# parameters, so unlike df-client-app.conf.template this needs no envsubst.
#
# Extracted from Dockerfile-static-site-local, where it lived inside an escaped
# `RUN echo "..."` shell string.
server {
    listen 3500;
    autoindex off;
    server_name _;
    server_tokens off;
    root /static;
    gzip_static on;

    # This config previously set no security headers at all.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Identical to the <meta http-equiv="Content-Security-Policy"> in
    # df-static-site/index.html, plus frame-ancestors. Kept in sync by
    # df-client-app's src/test/contentSecurityPolicy.test.ts.
    #
    # script-src allows the inline GTM bootstrap by SHA-256 hash rather than
    # 'unsafe-inline', so injected inline script is still blocked. This is the same
    # bootstrap, and the same hash, df-client-app enforces. Editing that script changes
    # its hash -- df-client-app/src/test/contentSecurityPolicy.test.ts fails until this
    # and the <meta> tag in df-static-site/index.html are both updated.
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; form-action 'none'; style-src 'self' 'unsafe-inline' https://www.ssa.gov/accessibility/andi/andi.css https://www.ssa.gov/accessibility/andi/gandi.css https://www.ssa.gov/accessibility/andi/landi.css https://www.ssa.gov/accessibility/andi/handi.css https://www.ssa.gov/accessibility/andi/candi.css https://www.ssa.gov/accessibility/andi/sandi.css https://stage.connect.irs.gov https://connect.irs.gov; style-src-elem 'self' 'unsafe-inline' https://stage.connect.irs.gov https://connect.irs.gov; frame-src https://www.youtube.com https://stage.connect.irs.gov https://connect.irs.gov; script-src 'self' 'sha256-hC4yLITI6QgJ9q9gPxAnKXkGcJVe+lNpHs4+YYDrr20=' https://*.googletagmanager.com https://resources.digital-cloud-gov.medallia.com https://dap.digitalgov.gov http://resources.digital-cloud-gov.medallia.com https://www.ssa.gov/accessibility/andi/ https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js https://stage.connect.irs.gov https://connect.irs.gov; script-src-attr 'none'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com https://www.ssa.gov; frame-ancestors 'none';" always;

    location / {
        try_files $uri /index.html;
    }
}
