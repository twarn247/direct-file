name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR branch makes an in-flight run obsolete. Only for
# pull_request: this group also covers push-to-main runs (via github.ref), and
# cancelling those would leave an earlier main commit without a completed
# status once build-and-test becomes a required check (handback item 1).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test Java services
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8

      # The Scala compile is the slowest step in the pipeline and its output only
      # changes when fact-graph-scala does. Keyed on that subtree alone so a change
      # to any Java service still gets a cache hit.
      - name: Cache Scala build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
            direct-file/fact-graph-scala/target
            direct-file/fact-graph-scala/project/target
          key: scala-${{ runner.os }}-${{ hashFiles('direct-file/fact-graph-scala/**/*.scala', 'direct-file/fact-graph-scala/build.sbt', 'direct-file/fact-graph-scala/project/build.properties') }}
          restore-keys: |
            scala-${{ runner.os }}-

      # backend/pom.xml declares gov.irs.factgraph:fact-graph_3, which is not on
      # Maven Central. publishM2 is the only thing that puts it in ~/.m2, so no
      # service can compile until this runs. Mirrors scripts/build-fact-graph.sh.
      - name: Publish fact-graph to the local Maven repository
        working-directory: direct-file/fact-graph-scala
        run: sbt compile package publishM2

      # Builds the boms, data-models, and starters aggregate. Mirrors
      # scripts/build-dependencies.sh.
      - name: Install shared libraries
        working-directory: direct-file/libs
        run: ./mvnw --batch-mode --no-transfer-progress clean install

      - name: Build and test backend
        working-directory: direct-file/backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Build and test state-api
        working-directory: direct-file/state-api
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # status and submit are deliberately not built here. Both import
      # gov.irs.mef.* / gov.irs.efile.* (a MeF SOAP client library) that is
      # declared in neither pom, has no source anywhere in this checkout, and is
      # not published on any repository this workflow can reach -- confirmed by a
      # failed CI run (30 compile errors in status, all missing gov.irs.mef/efile
      # symbols) and by grepping the whole tree for a declaration, a local jar, a
      # <repository> block, or a codegen plugin that could produce them, all
      # absent. This is IRS-internal and not part of the public release, the same
      # category as analytics/data-import (see build-sbom.sh), just undiscovered
      # until this pipeline tried to compile them. See the plan's ledger and the
      # PR description for the full investigation.

      - name: Build and test email-service
        working-directory: direct-file/email-service
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: direct-file/*/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30
    # security-events: write is scoped to this job only. build-and-test runs mvn
    # verify, which executes plugin and test code drawn from the same dependency
    # tree this job scans -- that step should not also hold write access to code
    # scanning.
    #
    # As of 2026-09-03 that tree measures 0 CRITICAL / 0 HIGH across all six
    # scanned modules (raw per-module sum, not deduplicated -- a shared CVE across
    # modules is counted once per module here, but once total on the GitHub Code
    # Scanning dashboard). The pre-triage baseline was 49 CRITICAL / 257 HIGH raw;
    # see docs/security/2026-09-03_spring-boot-bump-measurement.md for what closed
    # it and direct-file/.trivyignore's header for how a future finding gets
    # justified rather than silenced. This is a point-in-time count, not a current
    # guarantee -- vulnerability databases change daily.
    #
    # Branch protection on main is not configured yet (a standing gap tracked
    # separately, outside this workflow file). When it is: make build-and-test a
    # required status check, but NOT this job. A newly published CVE against any
    # transitive dependency turns this job red on every open PR with no repository
    # change -- including the PR that would add the .trivyignore entry to fix it,
    # if this job were required. Blocking-but-not-required keeps that recovery
    # path open while still surfacing every finding.
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8

      - name: Restore Scala build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
            direct-file/fact-graph-scala/target
            direct-file/fact-graph-scala/project/target
          key: scala-${{ runner.os }}-${{ hashFiles('direct-file/fact-graph-scala/**/*.scala', 'direct-file/fact-graph-scala/build.sbt', 'direct-file/fact-graph-scala/project/build.properties') }}
          restore-keys: |
            scala-${{ runner.os }}-

      # The BOM records resolved dependencies, so the fact-graph and libs must be in
      # ~/.m2 for resolution to succeed -- same prerequisite as the build job.
      - name: Publish fact-graph to the local Maven repository
        working-directory: direct-file/fact-graph-scala
        run: sbt compile package publishM2

      - name: Install shared libraries
        working-directory: direct-file/libs
        run: ./mvnw --batch-mode --no-transfer-progress clean install -DskipTests

      # cyclonedx-maven-plugin is configured in the parent pom but has no <executions>,
      # so it is not bound to a phase and must be invoked by goal. status and submit are
      # included here even though they cannot compile (see build-and-test's comment) --
      # makeBom only needs the declared dependency tree to resolve, not the module's own
      # source, and this was confirmed empirically: `./mvnw cyclonedx:makeBom` succeeds
      # against status on its own, producing a full BOM, independent of the missing
      # gov.irs.mef.* classes.
      - name: Generate CycloneDX SBOMs
        working-directory: direct-file
        run: |
          set -e
          for module in backend state-api status submit email-service libs/data-models; do
            echo "::group::SBOM for $module"
            (cd "$module" && ./mvnw --batch-mode --no-transfer-progress cyclonedx:makeBom)
            echo "::endgroup::"
          done

      - name: Collect SBOMs
        working-directory: direct-file
        run: |
          mkdir -p ../sboms
          for module in backend state-api status submit email-service libs/data-models; do
            cp "$module/target/bom.json" "../sboms/$(echo "$module" | tr '/' '-').bom.json"
          done
          ls -la ../sboms

      - name: Upload SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyclonedx-sboms
          path: sboms/
          retention-days: 30

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # Every other action in this workflow is SHA-pinned; the trivy binary itself
          # was the one unpinned input to a now-blocking gate (defaults to `latest`).
          # A trivy release that changes severity mapping, adds a detector, or alters
          # .trivyignore parsing would otherwise turn CI red with no repository change.
          # Update deliberately, alongside re-verifying the measurements this plan's
          # decision record and CVE pins are based on -- see
          # docs/security/2026-09-03_spring-boot-bump-measurement.md.
          version: v0.74.0

      # trivy's `sbom` subcommand scans one artifact at a time (it is a direct passthrough
      # to `trivy sbom <path>`, confirmed by reading aquasecurity/trivy-action's own
      # entrypoint script), not a directory -- so this loops per module rather than
      # pointing scan-ref at the whole sboms/ directory, which the wrapper action does not
      # document as supported for this scan type.
      #
      # Blocking as of 2026-09-03. --exit-code 1 means a CRITICAL or HIGH finding fails
      # this job. Everything known at that date is either fixed, pinned, or carried in
      # direct-file/.trivyignore with a written justification and an expiry, so a new
      # failure here means a genuinely new finding -- or an expired exception, which is
      # the same signal by design.
      #
      # The `status=1` handling below is unchanged and still distinguishes a scan ERROR
      # (malformed SBOM, vuln-DB fetch failure) from a FINDING: an error on one module
      # must not abort the loop before the rest are scanned. Both now fail the job, but
      # the ::error:: annotation says which happened.
      - name: Scan SBOMs with Trivy
        run: |
          mkdir -p trivy-results
          status=0
          for f in sboms/*.bom.json; do
            name=$(basename "$f" .bom.json)
            echo "::group::Scanning $name"
            if ! trivy sbom "$f" \
                  --format sarif \
                  --output "trivy-results/$name.sarif" \
                  --severity CRITICAL,HIGH \
                  --ignorefile direct-file/.trivyignore \
                  --exit-code 1; then
              echo "::error::Trivy failed for $name (a finding, or a scan error -- see the group above)"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      # One step per module rather than a single directory upload: GitHub Code
      # Scanning stopped combining multiple SARIF runs uploaded under the same
      # category (confirmed by a failed run -- "The CodeQL Action does not support
      # uploading multiple SARIF runs with the same category"), so each module's
      # SARIF needs its own upload-sarif call with a distinct category. Six
      # explicit steps rather than a loop, matching this workflow's existing
      # single-sequential-job philosophy: obviously correct over clever.
      - name: Upload SARIF (backend)
        # GITHUB_TOKEN on a fork-triggered pull_request is read-only regardless of
        # the permissions block above, so these six steps would fail on every
        # external contributor's PR without this guard. Runs unconditionally on
        # push (no pull_request context to check) and on same-repo pull_requests.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: trivy-results/backend.sarif
          category: trivy-backend

      - name: Upload SARIF (state-api)
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: trivy-results/state-api.sarif
          category: trivy-state-api

      - name: Upload SARIF (status)
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: trivy-results/status.sarif
          category: trivy-status

      - name: Upload SARIF (submit)
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: trivy-results/submit.sarif
          category: trivy-submit

      - name: Upload SARIF (email-service)
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: trivy-results/email-service.sarif
          category: trivy-email-service

      - name: Upload SARIF (libs/data-models)
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: trivy-results/libs-data-models.sarif
          category: trivy-data-models

      - name: Summarise findings
        if: always()
        run: |
          echo "### Dependency scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Reporting-only. Findings are in the Security tab, one category per module:" >> "$GITHUB_STEP_SUMMARY"
          echo "trivy-backend, trivy-state-api, trivy-status, trivy-submit, trivy-email-service, trivy-data-models." >> "$GITHUB_STEP_SUMMARY"

  client:
    name: Lint and test the client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: direct-file/df-client/df-client-app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: direct-file/df-client/.nvmrc
          cache: npm
          # df-client-app has no lockfile of its own -- it's an npm workspace member.
          # The real lockfile (and workspace root) is direct-file/df-client/. Pointing
          # this at a nonexistent file would break setup-node's cache-key computation.
          cache-dependency-path: direct-file/df-client/package-lock.json

      # df-client-app is an npm workspace member, not a standalone project: some tools
      # (stylelint among them) are declared as devDependencies at the workspace root
      # (direct-file/df-client/package.json) rather than in df-client-app's own
      # package.json. Running `npm ci` scoped to df-client-app alone installs only
      # its own direct dependency tree and silently skips those -- confirmed by
      # reproducing "stylelint: not found" locally with exactly this working
      # directory, then fixing it by installing from the workspace root instead.
      # Once installed there, the later steps' ancestor node_modules/.bin lookup
      # resolves correctly from df-client-app, so only this one step needs to move.
      - name: Install dependencies
        working-directory: direct-file/df-client
        run: npm ci

      # Both lint scripts run with --max-warnings=0. prelint:ts runs tsc --build, so this
      # also type-checks.
      - name: Lint
        run: npm run lint

      # Three suites because the repository splits them that way: test:ci excludes the
      # completeness, functional-flow, and all-screens directories, which :2 and :3 cover.
      # if: always() on the latter two is load-bearing, not decorative: GitHub Actions
      # halts a job at the first failed step by default, so without if: always() a Test
      # failure would silently skip :2 and :3 entirely. Confirmed via a real CI run that
      # this was already happening before if: always() was added.
      - name: Test
        run: npm run test:ci

      - name: Test (completeness and functional flows)
        if: always()
        run: npm run test:ci:2

      - name: Test (all screens)
        if: always()
        run: npm run test:ci:3
